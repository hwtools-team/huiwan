<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>称号专用：svga转apng和webp</title>
  <script type="module" crossorigin src="../assets/index-Csdqzm9M.js"></script>
  <link rel="stylesheet" crossorigin href="../assets/index-C4xsNVdO.css">
  <link rel="stylesheet" href="./preview-addon.css">
  <style>
    .converter-nav {
      display: flex;
      margin-bottom: -8px;
    }

    .converter-home-link {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      border: 1px solid var(--border-color);
      border-radius: 999px;
      padding: 8px 13px;
      color: var(--text-secondary);
      background: rgba(20, 20, 20, 0.88);
      font-size: 12px;
      font-weight: 650;
      text-decoration: none;
      transition: var(--transition);
    }

    .converter-home-link:hover {
      border-color: var(--accent-color);
      color: var(--text-primary);
      transform: translateY(-1px);
    }
  </style>
</head>
<body>
  <div class="app-container">
    <nav class="converter-nav" aria-label="返回团队工具首页">
      <a class="converter-home-link" href="../">
        <span aria-hidden="true">←</span>
        团队工具首页
      </a>
    </nav>

    <header class="header">
      <h1>称号专用：svga转apng和webp</h1>
      <p class="subtitle">将 SVGA 动画无损转换为 APNG 和 WEBP 格式</p>
    </header>

    <main class="main-content">
      <div id="dropzone" class="dropzone">
        <div class="dropzone-inner">
          <div class="drop-icon">
            <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
              <path d="M7 10V9C7 6.23858 9.23858 4 12 4C14.7614 4 17 6.23858 17 9V10C19.2091 10 21 11.7909 21 14C21 15.4806 20.1956 16.8084 19 17.5M7 10C4.79086 10 3 11.7909 3 14C3 15.4806 3.8044 16.8084 5 17.5M7 10C7.43285 10 7.84965 10.0688 8.24006 10.1959M12 12V21M12 12L15 15M12 12L9 15" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
          </div>
          <h2 class="drop-title">拖拽 SVGA 文件至此</h2>
          <p class="drop-desc">支持批量转换，完成后自动下载</p>
          <button class="select-btn" id="selectBtn">选择文件</button>
          <input type="file" id="fileInput" accept=".svga" multiple hidden />
        </div>
      </div>

      <section id="previewSection" class="preview-section hidden" aria-labelledby="previewTitle">
        <div class="preview-heading">
          <div>
            <span class="preview-kicker">导入预览</span>
            <h2 id="previewTitle">SVGA 动画预览</h2>
          </div>
          <span id="previewCount" class="preview-count">0 个文件</span>
        </div>
        <div id="previewGrid" class="preview-grid"></div>
      </section>

      <div id="batchSummary" class="batch-summary hidden">
        <div class="summary-info">
          <span class="summary-text" id="summaryText">正在处理: 0 / 0</span>
          <div class="progress-bar-container">
            <div class="progress-bar" id="summaryProgress"></div>
          </div>
        </div>
        <button id="downloadAllBtn" class="download-all-btn hidden">
          <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="7 10 12 15 17 10"></polyline><line x1="12" y1="15" x2="12" y2="3"></line></svg>
          全部下载
        </button>
      </div>

      <div id="results" class="results-list">
        <div id="emptyState" class="empty-state">
          <div class="empty-icon">✨</div>
          <p>暂无转换任务</p>
        </div>
      </div>
    </main>
  </div>

  <canvas id="renderCanvas" style="display:none;"></canvas>
  <script src="../svga.min.js"></script>
  <script src="./preview-addon.js"></script>
</body>
</html>
